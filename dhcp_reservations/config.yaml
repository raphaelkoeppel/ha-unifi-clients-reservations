name: "IP Manager for UniFi"
version: "1.32.1"
slug: dhcp_reservations
description: "UniFi clients, fixed IPs and DHCP reservations – IP plan, cleanup, firewall analysis and rules, relations graph, views, bulk changes, versions (unofficial)"
url: https://github.com/ha-unifi-friends/ha-ip-manager-unifi
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:ip-network
panel_title: "IP Manager"
options:
  unifi_host: 192.168.1.1
  username: ""
  password: ""
  site: default
  verify_ssl: false
  certificate_fingerprint: ""
  api_key: ""
  daily_version: true
  auto_version_retention_days: 30
  notify_new_devices: true
  notify_networks: []
  notify_random_mac: false
  vendor_lookup: true
schema:
  unifi_host: str
  username: str
  password: password
  site: str
  verify_ssl: bool
  certificate_fingerprint: str?
  api_key: password?
  daily_version: bool?
  auto_version_retention_days: int(1,3650)?
  notify_new_devices: bool?
  notify_networks:
    - str
  notify_random_mac: bool?
  vendor_lookup: bool?
